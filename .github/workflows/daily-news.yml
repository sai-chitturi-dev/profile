name: Daily news

on:
  schedule:
    - cron: '30 5 * * *'   # every day at 05:30 UTC (5:30 am UK in winter, 6:30 am in summer)
  workflow_dispatch:        # adds a "Run workflow" button so you can run it any time

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch the news
        run: node scripts/fetch-news.js

      - name: Commit news.json if it changed
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Daily news $(date -u +'%Y-%m-%d')"
          git push